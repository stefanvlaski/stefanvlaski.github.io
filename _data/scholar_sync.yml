# Settings for bin/scholar_sync.py, which adds new Google Scholar publications to
# _bibliography/papers.bib (run weekly by .github/workflows/scholar-sync.yml).

# Google Scholar profile id (the "user=" part of the profile URL).
scholar_user_id: mghzVekAAAAJ

# Only propose publications from this year onwards. Older Scholar items that are not in
# papers.bib are assumed to have been left out on purpose.
min_year: 2024

# Scholar items that should never be proposed: their scholar_id (e.g. "u5HHmVD_uO8C")
# or their exact title.
ignore:
  # arXiv version (2601.02682, "Topology-Independent Robustness of the Weighted Mean ...") of the
  # IEEE TSIPN paper "Topology-Independent Learning Error of the Weighted Mean ..."; the
  # journal version (scholar_id dshw04ExmUIC) is kept.
  - P5F9QuxV20EC
