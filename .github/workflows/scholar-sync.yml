name: Sync publications from Google Scholar

# Weekly, checks the Google Scholar profile for publications that are not yet in
# _bibliography/papers.bib and opens a pull request adding them (see bin/scholar_sync.py).
# Merging the pull request triggers the normal site deploy.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      min_year:
        description: "Only consider publications from this year on (default: min_year in _data/scholar_sync.yml)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml

      - name: Fetch new publications
        env:
          # Optional. Without it, Google Scholar is queried directly, which Google frequently
          # blocks from GitHub's servers. A free SerpAPI key (serpapi.com) avoids that.
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python bin/scholar_sync.py --report "$RUNNER_TEMP/scholar_report.md" \
            ${{ inputs.min_year && format('--min-year {0}', inputs.min_year) || '' }}
          cat "$RUNNER_TEMP/scholar_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: scholar-sync
          delete-branch: true
          add-paths: _bibliography/papers.bib
          commit-message: "Add new publications from Google Scholar"
          title: "New publications from Google Scholar"
          body-path: ${{ runner.temp }}/scholar_report.md
