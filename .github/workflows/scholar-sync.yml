name: Sync publications from Google Scholar

# Weekly, checks the Google Scholar profile for publications that are not yet in
# _bibliography/papers.bib (bin/scholar_sync.py), links publications to their arXiv
# versions (bin/arxiv_links.py), adds preview figures (bin/arxiv_figures.py), and opens a pull
# request with the changes.
# Merging the pull request triggers the normal site deploy.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      min_year:
        description: "Only consider publications from this year on (default: min_year in _data/scholar_sync.yml)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript fonts-dejavu-core > /dev/null
          pip install requests beautifulsoup4 pyyaml pymupdf pillow numpy anthropic

      - name: Fetch new publications
        env:
          # Optional. Without it, Google Scholar is queried directly, which Google frequently
          # blocks from GitHub's servers. A free SerpAPI key (serpapi.com) avoids that.
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python bin/scholar_sync.py --report "$RUNNER_TEMP/scholar_report.md" \
            ${{ inputs.min_year && format('--min-year {0}', inputs.min_year) || '' }}

      - name: Add arXiv links
        # Links publications to their arXiv versions, including papers posted to arXiv after
        # they were first added. Not fatal: the Scholar results still go out if arXiv is down.
        continue-on-error: true
        run: |
          python bin/arxiv_links.py --report "$RUNNER_TEMP/scholar_report.md"

      - name: Add preview figures
        # Picks a figure from the arXiv version of each publication that has no preview yet.
        # With the optional ANTHROPIC_API_KEY secret Claude picks it; otherwise a scoring rule.
        # Not fatal: the rest of the update still goes out if this fails.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bin/arxiv_figures.py --auto --report "$RUNNER_TEMP/scholar_report.md"

      - name: Summary
        run: cat "$RUNNER_TEMP/scholar_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: scholar-sync
          delete-branch: true
          add-paths: |
            _bibliography/papers.bib
            assets/img/publication_preview
          commit-message: "Update publications from Google Scholar and arXiv"
          title: "Publication updates from Google Scholar and arXiv"
          body-path: ${{ runner.temp }}/scholar_report.md
