# TEMPORARY: runs bin/arxiv_links.py once against the real arXiv on this pull request and
# commits the result to the PR branch for review. Remove before merging.
name: arXiv links (one-off)

on:
  pull_request:
    paths:
      - "bin/arxiv_links.py"
      - ".github/workflows/arxiv-links-once.yml"

permissions:
  contents: write

jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pyyaml
      - name: Add arXiv links
        run: |
          python bin/arxiv_links.py --report "$RUNNER_TEMP/arxiv_report.md"
          cat "$RUNNER_TEMP/arxiv_report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git diff --cached --quiet || git commit -m "Add arXiv links to publications"
          git push
